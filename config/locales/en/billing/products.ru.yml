ru:
  billing/products:
    free:
      name: Бесплатно
    basic:
      name: Базовый
      description: Это пример тарифного плана, включающего бесплатный пробный период при ежемесячной оплате.
      features:
      - Демонстрирует ценообразование на каждого члена команды.
      - Позволяет создавать до пятидесяти “Креативных Концепций”.
      - Мягкое применение этого ограничения.
    pro:
      name: Про
      description: Усовершенствованный пример тарифного плана, демонстрирующий различные функции.
      features:
      - Демонстрирует фиксированную цену для команды до десяти человек.
      - Позволяет создавать неограниченное количество “Креативных Концепций”.