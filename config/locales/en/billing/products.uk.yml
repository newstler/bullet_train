uk:
  billing/products:
    free:
      name: Безкоштовно
    basic:
      name: Базовий
      description: Це приклад тарифного плану, який включає безкоштовний пробний період при щомісячній оплаті.
      features:
      - Демонструє ціноутворення на кожного члена команди.
      - Дозволяє створення до п'ятдесяти „Творчих Концепцій“.
      - М'яке застосування цього обмеження.
    pro:
      name: Професійний
      description: Удосконалений приклад тарифного плану, який демонструє різні функції.
      features:
      - Демонструє фіксовану ціну для команди до десяти осіб.
      - Дозволяє створення необмеженої кількості „Творчих Концепцій“.